name: Quarterly FD rates
on:
  schedule:
    - cron: "30 4 5 1,4,7,10 *"   # 5th of Jan/Apr/Jul/Oct, 10:00 IST
  workflow_dispatch: {}            # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools (AI fallback, PDF reader, headless browser for Kotak)
        run: |
          pip install anthropic pypdf playwright
          playwright install --with-deps chromium
      - name: Fetch rates with the rate agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd rate-feed
          python rate_agent.py --prev rates.json --out rates.json
      - name: Publish rates straight to main
        run: |
          git config user.name "fd-rates-bot"
          git config user.email "fd-rates-bot@users.noreply.github.com"
          git add rate-feed/rates.json
          git diff --cached --quiet && echo "No change in rates" && exit 0
          git commit -m "Update FD rates"
          git push
